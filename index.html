<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Candidatos - BIC</title>
    <link rel="stylesheet" href="Webpage/Candidatos.es-ES.customcss.css">
</head>
<body>

<div class="form-container">
    <img src="Imagenes/Logo.png" alt="Logo BIC" onerror="this.style.display='none'" class="top-logo" />
    <div class="form-header">
        <h2>Registro de Nuevo Ingreso</h2>
        <div class="badge-anon">📝 Portal de Atracción de Talento BIC</div>
        <p>Por favor, completa tu información y sube tus documentos.</p>
    </div>

    <form id="datosForm" class="form-card">
        
        <!-- SECCIÓN 1: DATOS PERSONALES -->
        <h3 class="section-title">
            <img src="Imagenes/Datos.png" alt="" onerror="this.style.display='none'" class="section-icon" /> Datos Personales
        </h3>
        <div class="grid-2">
            <div class="form-group">
                <label>Nombre(s) *</label>
                <input type="text" id="nombre" class="form-control-custom" required>
            </div>
            <div class="form-group">
                <label>Apellido Paterno *</label>
                <input type="text" id="apellidoPaterno" class="form-control-custom" required>
            </div>
            <div class="form-group">
                <label>Apellido Materno *</label>
                <input type="text" id="apellidoMaterno" class="form-control-custom" required>
            </div>
            <div class="form-group">
                <label>Fecha de Nacimiento *</label>
                <input type="date" id="fechaNacimiento" class="form-control-custom" required>
            </div>
        </div>

        <div class="grid-3">
            <div class="form-group">
                <label>RFC (Con Homoclave) *</label>
                <input type="text" id="rfc" class="form-control-custom" maxlength="13" required>
            </div>
            <div class="form-group">
                <label>CURP *</label>
                <input type="text" id="curp" class="form-control-custom" maxlength="18" required>
            </div>
            <div class="form-group">
                <label>NSS (11 dígitos) *</label>
                <input type="text" id="nss" class="form-control-custom" maxlength="11" required>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label><img src="Imagenes/whatsapp.png" alt="" onerror="this.style.display='none'" class="inline-icon" />WhatsApp / Celular *</label>
                <input type="tel" id="telefonoWhatsapp" class="form-control-custom" maxlength="10" required>
            </div>
            <div class="form-group">
                <label>Estado Civil *</label>
                <select id="estadoCivil" class="form-control-custom" required>
                    <option value="">Selecciona...</option>
                    <option value="Soltero">Soltero(a)</option>
                    <option value="Casado">Casado(a)</option>
                    <option value="Unión Libre">Unión Libre</option>
                    <option value="Divorciado">Divorciado(a)</option>
                    <option value="Viudo">Viudo(a)</option>
                </select>
            </div>
        </div>

        <!-- SECCIÓN DINÁMICA: FAMILIA -->
        <h3 class="section-title mt-30">
            <img src="Imagenes/Family.png" alt="" onerror="this.style.display='none'" class="section-icon" /> Información Familiar
        </h3>
        
        <div id="seccionPareja" class="hidden dynamic-box">
            <h4>Datos de la Pareja</h4>
            <div class="grid-2">
                <div class="form-group">
                    <label>Nombre Completo de Pareja *</label>
                    <input type="text" id="pareja" class="form-control-custom">
                </div>
                <div class="form-group">
                    <label>Fecha Nacimiento Pareja *</label>
                    <input type="date" id="fechaNacPareja" class="form-control-custom">
                </div>
            </div>
            <div class="file-upload-wrapper mt-15">
                <label>💍 Acta de Pareja (PDF/JPG) *</label>
                <input type="file" id="fileActaPareja" class="form-control-custom" accept=".pdf,image/*">
            </div>
        </div>

        <div class="grid-2 mt-15">
            <div class="form-group">
                <label>¿Tienes Hijos?</label>
                <select id="tieneHijos" class="form-control-custom">
                    <option value="No">No</option>
                    <option value="Si">Sí</option>
                </select>
            </div>
            <div class="form-group hidden" id="seccionCantidadHijos">
                <label>¿Cuántos hijos tienes? *</label>
                <select id="cantidadHijos" class="form-control-custom">
                    <option value="0">0</option>
                    <option value="1">1</option><option value="2">2</option>
                    <option value="3">3</option><option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>
        </div>
        
        <!-- Aquí caen los hijos dinámicos -->
        <div id="contenedorHijos"></div>

        <!-- SECCIÓN 2: DOMICILIO -->
        <h3 class="section-title mt-30">
            <img src="Imagenes/Domicilio.png" alt="" onerror="this.style.display='none'" class="section-icon" /> Domicilio
        </h3>
        <div class="grid-2">
            <div class="form-group">
                <label>Código Postal * <span id="cp-status" style="font-size: 0.85em; margin-left: 10px;"></span></label>
                <input type="text" id="codigoPostal" class="form-control-custom" maxlength="5" required>
            </div>
            <div class="form-group">
                <label>Municipio/Ciudad *</label>
                <input type="text" id="ciudad" class="form-control-custom" readonly required>
            </div>
        </div>
        <div class="grid-2">
            <div class="form-group" id="container-colonia-select">
                <label>Colonia *</label>
                <select id="colonia-select" class="form-control-custom"></select>
            </div>
            <div class="form-group hidden" id="container-colonia-input">
                <label>Colonia (Escríbela) *</label>
                <input type="text" id="colonia-input" class="form-control-custom">
            </div>
            <div class="form-group">
                <label>Calle *</label>
                <input type="text" id="calle" class="form-control-custom" required>
            </div>
        </div>
        <div class="grid-2">
            <div class="form-group">
                <label>Número (Exterior / Interior) *</label>
                <input type="text" id="numeroDomicilio" class="form-control-custom" required>
            </div>
        </div>

        <!-- SECCIÓN 3: EXPEDIENTE DIGITAL -->
        <h3 class="section-title mt-30">
            <img src="Imagenes/Folder.png" alt="" onerror="this.style.display='none'" class="section-icon" /> Expediente Digital (PDF o Imagen)
        </h3>
        <div class="grid-2">
            <div class="file-upload-wrapper"><label>📄 Acta de Nacimiento *</label><input type="file" id="fileActaNac" class="form-control-custom" accept=".pdf,image/*" required></div>
            <div class="file-upload-wrapper"><label>🪪 INE (Frente y Vuelta) *</label><input type="file" id="fileIne" class="form-control-custom" accept=".pdf,image/*" required></div>
            <div class="file-upload-wrapper"><label>📄 CURP *</label><input type="file" id="fileCurp" class="form-control-custom" accept=".pdf,image/*" required></div>
            <div class="file-upload-wrapper"><label>📄 Constancia Situación Fiscal *</label><input type="file" id="fileCsf" class="form-control-custom" accept=".pdf,image/*" required></div>
            <div class="file-upload-wrapper"><label>🏥 Número de Seguro Social *</label><input type="file" id="fileNss" class="form-control-custom" accept=".pdf,image/*" required></div>
            <div class="file-upload-wrapper"><label>🏠 Comprobante de Domicilio *</label><input type="file" id="fileDomicilio" class="form-control-custom" accept=".pdf,image/*" required></div>
            <div class="file-upload-wrapper"><label>🎓 Comprobante de Estudios *</label><input type="file" id="fileEstudios" class="form-control-custom" accept=".pdf,image/*" required></div>
        </div>

        <div id="status" class="status-message"></div>

        <button type="submit" id="btnEnviar" class="btn-submit">Guardar Candidato y Expediente</button>
    </form>
    
    <img src="Imagenes/barra.jpg" alt="Barra Decorativa" onerror="this.style.display='none'" style="width:100%; border-radius:8px; margin-top:40px;" />
</div>

<script src="Webpage/Candidatos.es-ES.customjs.js"></script>
</body>
</html>
